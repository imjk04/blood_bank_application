apiVersion: v1                  # Uses the core Kubernetes API version v1.
kind: Service                   # Declares this resource is a Service.
metadata:
  name: db-service                 # The name of this Service object is "mysqldb".
spec:
  clusterIP: None               # Creates a headless Service (no cluster IP). Used with StatefulSets for stable DNS.
  selector:
    app: dbset           # Selects pods with label "app=app-database" to route traffic to.
  ports:
    - port: 3306                # Exposes port 3306 on the Service (clients connect here).
      targetPort: 3306          # Forwards traffic to port 3306 inside the selected pods (MySQL default port).

